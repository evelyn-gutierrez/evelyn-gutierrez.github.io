name: Validate portfolio

on:
  pull_request:
  push:
    branches: [portfolio-redesign-2026]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check local links and document structure
        run: python scripts/check_portfolio.py
      - name: Check whitespace
        run: git diff --check

